[project]
name = "release-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raven Paragas", email = "ravenp.dev@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.115.0",
    "httpx2>=2.9.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[tool.fastapi]
entrypoint = "release_tracker.main:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
